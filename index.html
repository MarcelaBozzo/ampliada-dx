<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050c26">
<title>Juegos en vivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;0,900;1,800;1,900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#040b24;--navy2:#0a1a4d;--navy3:#13296e;--orange:#ff8a1f;--orange2:#ffb04a;--orange3:#ff6a00;
  --ink:#0d1533;--muted:#5d6785;--line:#e2e6f1;--ok:#22a861;--bad:#e2464b;--gold:#ffc23d;
  font-family:Montserrat,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--navy)}
html,body{margin:0;min-height:100%}
body{color:#fff;min-height:100vh;min-height:100dvh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%}
.hidden{display:none!important}

/* ---------- fondo estilo portada ---------- */
.bg,.bgx{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:radial-gradient(900px 600px at 85% 8%,rgba(40,80,200,.45),transparent 60%),
             radial-gradient(800px 500px at -5% 105%,rgba(255,138,31,.18),transparent 60%),
             linear-gradient(160deg,#0b1c52 0%,#06103a 50%,#030820 100%)}
.bgx{position:absolute;z-index:0}
.bg svg,.bgx svg{position:absolute;inset:0;width:100%;height:100%}
.bg svg path{animation:breathe 7s ease-in-out infinite alternate}
.bg svg path:nth-child(even){animation-delay:-3s}
.bg .dots,.bgx .dots{position:absolute;right:0;bottom:0;width:65%;height:50%;
  background-image:radial-gradient(circle,rgba(110,160,255,.5) 1.2px,transparent 1.7px);background-size:14px 14px;
  -webkit-mask-image:radial-gradient(ellipse at 100% 100%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse at 100% 100%,#000 5%,transparent 70%);opacity:.55}
@keyframes breathe{from{opacity:.45}to{opacity:1}}

/* ---------- base ---------- */
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:.75em 1.25em;font-weight:700;transition:transform .08s,filter .15s,background .15s;color:inherit}
button:active:not(:disabled){transform:scale(.97)}
button:hover:not(:disabled){filter:brightness(1.08)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--orange2);outline-offset:2px}
.btn{background:#fff;color:var(--ink)}
.btn.primary{background:linear-gradient(135deg,var(--orange2),var(--orange) 45%,var(--orange3));color:#1d0e00;box-shadow:0 10px 28px rgba(255,138,31,.35)}
.btn.ghost{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.btn.light{background:#eef1f8;color:var(--ink)}
.btn.danger{background:#ffe9e9;color:#a8201a}
.btn.big{font-size:1.1rem;padding:.95em 1.6em}
.btn.sm{padding:.5em .85em;font-size:.86rem;border-radius:10px}
input,textarea,select{font:inherit;color:var(--ink)}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.78rem;font-weight:700;opacity:.8}
.spacer{flex:1}
.card{background:#fff;color:var(--ink);border-radius:20px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.28)}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* título del evento (como la portada) */
.evtitle{font-weight:900;line-height:1.02;letter-spacing:-.02em;font-size:clamp(2.2rem,5.2vw,4.6rem);margin:0;overflow-wrap:anywhere}
.evtitle em{font-style:italic;color:var(--orange);display:inline-block;position:relative;padding-right:.08em}
.evtitle em::after{content:"";position:absolute;left:-.35em;right:-.2em;bottom:-.16em;height:.3em;border-bottom:.07em solid var(--orange);border-radius:0 0 50% 50%;transform:rotate(-4deg)}
.evsub{font-size:clamp(1rem,1.7vw,1.4rem);font-weight:500;margin:.55em 0 0}
.evsub b{color:var(--orange);font-weight:700}
.tagline{letter-spacing:.38em;font-weight:700;text-transform:uppercase;font-size:clamp(.78rem,1.2vw,1.05rem);margin-top:1.1em;display:flex;align-items:center;gap:14px}
.tagline::before{content:"";width:36px;height:10px;border-top:3px solid var(--orange);border-bottom:3px solid var(--orange);flex:none}

/* ---------- barra superior ---------- */
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;min-height:74px;flex-wrap:wrap}
.brand{font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:10px;min-width:0}
.brand img{height:34px;width:auto;max-width:160px;object-fit:contain}
.brand .sep{width:1px;height:28px;background:rgba(255,255,255,.35)}
.brand b{color:var(--orange)}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 4px rgba(255,138,31,.25);flex:none}
.mini{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.1);padding:6px 14px 6px 6px;border-radius:14px;font-size:.88rem;line-height:1.3}
.mini .qr{width:56px;height:56px;border-radius:8px;overflow:hidden;background:#fff;flex:none}
.mini .qr svg{display:block;width:100%;height:100%}
.mini b{font-size:1.05rem;letter-spacing:.12em;color:var(--orange2)}
.count{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);padding:10px 14px;border-radius:14px;font-weight:700;white-space:nowrap}
.ldot{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25)}
.testbadge{background:var(--gold);color:#3a2800;font-weight:800;font-size:.75rem;letter-spacing:.1em;padding:6px 10px;border-radius:8px}
.saved{font-size:.85rem;opacity:.75;white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:6px 24px 120px}
.actions{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:flex-end;align-items:center;padding:14px 24px;background:linear-gradient(transparent,rgba(3,8,32,.85) 45%);z-index:10;flex-wrap:wrap}
.actions .left{margin-right:auto;display:flex;gap:10px;flex-wrap:wrap}

/* ---------- panel (inicio) ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,390px);gap:30px;align-items:center;margin:8px 0 30px}
.cta h2{margin:0 0 6px;font-size:1.35rem}
.cta p{color:var(--muted);margin:0 0 16px;line-height:1.45}
.cta .btn{width:100%}
.cta .code{font-size:1.7rem;font-weight:900;letter-spacing:.14em;color:var(--orange3)}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:rgba(255,138,31,.13);border:1px solid rgba(255,138,31,.45);border-radius:16px;padding:14px 18px;margin:0 0 24px}
.banner p{margin:0;flex:1;min-width:220px}
.sechead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.sechead h2{margin:0;font-size:1.6rem}
.sechead p{margin:4px 0 0;opacity:.75}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.rcard{padding:18px;display:flex;flex-direction:column;gap:12px;min-height:150px}
.rchead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rchead h3{margin:3px 0 0;font-size:1.3rem;overflow-wrap:anywhere}
.cnt{background:rgba(255,138,31,.18);color:var(--orange2);padding:4px 10px;border-radius:99px;font-weight:700;font-size:.82rem;white-space:nowrap}
.rqs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;flex:1;align-content:start}
.rqs li,.qnav>*{min-width:0}
.rqs li{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.05);border-radius:10px;padding:6px 8px;font-size:.9rem}
.rqs li.empty{opacity:.6;justify-content:center;padding:18px}
.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:1rem}
.rqs .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.74rem;opacity:.7;white-space:nowrap}
.rcfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.icon{background:rgba(255,255,255,.1);color:#fff;padding:6px 10px;border-radius:9px;font-weight:700;font-size:.9rem}
.addround{border:2px dashed rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:20px;min-height:150px;font-size:1.1rem}
details.card{margin-top:28px}
details.card summary{cursor:pointer;font-weight:800;font-size:1.1rem}
.field{display:grid;gap:6px;margin:14px 0}
.field>label,.flabel{font-weight:700;font-size:.86rem;color:var(--muted)}
.field input[type=text],.field textarea,.qform textarea,.qform input[type=text]{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;background:#fff}
.field input:focus,.qform textarea:focus,.qform input[type=text]:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,138,31,.2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{font-size:.85rem;color:var(--muted);margin:6px 0 0;line-height:1.4}
.foot-hint{opacity:.6;font-size:.88rem;margin-top:26px;text-align:center}
.logoprev{height:48px;width:auto;background:#0a1a4d;border-radius:8px;padding:6px}

/* ---------- editor (admin) ---------- */
.edtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 18px}
.edtop input{font-size:1.4rem;font-weight:800;background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 14px;min-width:0;flex:1;max-width:520px}
.editor{display:grid;grid-template-columns:250px minmax(0,1fr) 400px;gap:18px;align-items:start}
.qnav{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;position:sticky;top:12px;min-width:0}
.qitem{display:flex;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.06);color:#fff;border-radius:12px;padding:8px;font-weight:600;font-size:.88rem;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.qitem.on{background:#fff;color:var(--ink);box-shadow:0 0 0 3px var(--orange)}
.qitem .n{width:24px;height:24px;border-radius:7px;background:rgba(255,138,31,.25);color:var(--orange2);display:grid;place-items:center;font-size:.78rem;flex:none}
.qitem.on .n{background:var(--orange);color:#fff}
.qitem .thumb{width:36px;height:36px}
.qitem.on .thumb{background:#eef1f8}
.qitem .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qform{background:#fff;color:var(--ink);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.qform h3{margin:0;font-size:1.05rem;color:var(--orange3)}
.qform textarea.qtext{font-size:1.1rem;font-weight:700;resize:vertical}
.drop{border:2px dashed #c9cfe0;border-radius:16px;padding:16px;text-align:center;cursor:pointer;color:var(--muted);display:grid;place-items:center;gap:4px;min-height:110px;background:#fafbfe}
.drop.over{border-color:var(--orange);background:#fff5ea}
.drop.has{padding:8px;cursor:default}
.drop img{max-height:220px;border-radius:10px;object-fit:contain}
.drop .big{font-size:1.8rem}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:3px 10px 3px 8px}
.opt .letter{width:28px;height:28px;border-radius:8px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;flex:none;font-size:.88rem}
.opt input[type=text]{flex:1;border:0!important;padding:9px 4px!important;min-width:0;background:transparent!important;box-shadow:none!important}
.opt label{display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600}
input[type=radio],input[type=checkbox]{accent-color:var(--ok);width:18px;height:18px;cursor:pointer;flex:none}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--ink);cursor:pointer;font-weight:600}
.check.dis{opacity:.45;cursor:not-allowed}
.qform select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
.qfoot{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.qfoot .btn.light{font-size:.86rem}
.qprev{position:sticky;top:12px;display:grid;gap:10px;align-content:start}
.scaler{position:relative;width:100%;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 18px 40px rgba(0,0,0,.35)}
.scaled{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.phone{width:250px;margin:0 auto;border-radius:34px;padding:9px;background:#08080c;box-shadow:0 0 0 2px #2b2b36,0 20px 40px rgba(0,0,0,.45)}
.phone .scaler{border-radius:26px;box-shadow:none}
.prevnote{font-size:.8rem;opacity:.65;text-align:center;margin:0}

/* ---------- sala (hub) ---------- */
.hub{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:26px;align-items:start}
.joinbox{text-align:center}
.joinbox .qr{background:#fff;border-radius:16px;padding:8px;width:100%;max-width:330px;margin:0 auto}
.joinbox .qr svg{display:block;width:100%;height:auto}
.joinbox h2{margin:12px 0 2px;font-size:1.35rem}
.joinbox .code{font-size:2rem;font-weight:900;letter-spacing:.18em;color:var(--orange3)}
.joinbox .desc{font-size:.9rem;color:var(--muted);margin:6px 0 0;line-height:1.45}
.joinbox .url{font-size:.86rem;color:var(--muted);word-break:break-all;margin:4px 0 0}
.warn{background:#fff6dd;color:#7a5200;border-radius:12px;padding:10px 14px;margin-top:12px;font-size:.88rem;text-align:left;line-height:1.4}
.hubmain{display:grid;gap:22px}
.roster h2,.rlist h2{display:flex;align-items:center;gap:12px;margin:0 0 12px;font-size:1.3rem}
.badge{background:var(--orange);color:#1d0e00;border-radius:999px;padding:2px 12px;font-size:1rem;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:rgba(255,255,255,.13);color:#fff;padding:8px 13px;border-radius:999px;display:inline-flex;gap:6px;align-items:center;font-weight:650;font-size:1rem;animation:pop .3s ease-out;max-width:100%;overflow-wrap:anywhere}
.chip.done{background:#fff;color:var(--ink)}
.chip.off{opacity:.38}
.chip.bot::before{content:"🤖";font-size:.85em}
.chip button{padding:0 2px 0 6px;background:none;opacity:.55;font-size:.9rem}
.chip button:hover{opacity:1}
.empty{opacity:.7;font-size:1.05rem;padding:14px 0}
.hround{display:flex;align-items:center;gap:14px;padding:14px 16px;flex-wrap:wrap}
.hround+.hround{margin-top:10px}
.hround .rn{width:44px;height:44px;border-radius:12px;background:rgba(255,138,31,.2);color:var(--orange2);display:grid;place-items:center;font-weight:900;font-size:1.2rem;flex:none}
.hround .info{flex:1;min-width:180px}
.hround .info b{font-size:1.15rem;display:block;overflow-wrap:anywhere}
.hround .info span{opacity:.75;font-size:.9rem}
.hround.done .rn{background:var(--ok);color:#fff}
.status{font-size:.88rem;font-weight:700;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.1);white-space:nowrap}
.status.win{background:rgba(255,194,61,.18);color:var(--gold)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- intro de ronda / preparación ---------- */
.center-stage{position:relative;min-height:calc(100dvh - 74px - 90px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px;padding:10px 24px;overflow:hidden}
.rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;background:repeating-conic-gradient(from 0deg,rgba(255,138,31,.11) 0 9deg,transparent 9deg 18deg);animation:spin 50s linear infinite;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%);pointer-events:none;z-index:-1}
@keyframes spin{to{transform:rotate(360deg)}}
.dicerow{display:flex;gap:28px;align-items:flex-end;justify-content:center;min-height:180px}
.bigtitle{font-size:clamp(2.4rem,7vw,6rem);font-weight:900;line-height:1;margin:0;letter-spacing:-.02em;animation:zoomIn .7s 1.1s cubic-bezier(.2,1.3,.4,1) both;overflow-wrap:anywhere;max-width:100%}
.bigtitle em{color:var(--orange);font-style:italic}
.fadeup{animation:fadeUp .6s both}
.d1{animation-delay:1.3s}.d2{animation-delay:1.6s}.d3{animation-delay:1.9s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes zoomIn{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.readyq{font-size:clamp(1.6rem,3.6vw,3rem);font-weight:800;line-height:1.15;margin:0;max-width:1100px;overflow-wrap:anywhere}
.readybar{width:min(520px,80vw);height:10px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.readybar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--orange2),var(--orange));transform-origin:0 50%;animation:fillbar var(--d,4s) linear both}
@keyframes fillbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lead{font-size:clamp(1rem,1.6vw,1.35rem);opacity:.88;margin:0}

/* dado 3D */
.dice-scene{--s:140px;width:var(--s);height:var(--s);perspective:calc(var(--s)*6);position:relative;flex:none}
.dice{width:100%;height:100%;position:relative;transform-style:preserve-3d;animation:roll 1.8s cubic-bezier(.25,.8,.3,1) both}
.dice .f{position:absolute;inset:0;border-radius:20%;background:linear-gradient(145deg,#fff,#d9e0f0);box-shadow:inset 0 0 0 3px rgba(4,11,36,.08),inset 0 -8px 16px rgba(4,11,36,.14);display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.dice .f1{transform:translateZ(calc(var(--s) / 2));background:linear-gradient(145deg,var(--orange2),var(--orange) 55%,var(--orange3))}
.dice .f1 span{font-weight:900;font-size:calc(var(--s) * .5);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.2);line-height:1}
.dice .f2{transform:rotateY(180deg) translateZ(calc(var(--s) / 2))}
.dice .f3{transform:rotateY(90deg) translateZ(calc(var(--s) / 2))}
.dice .f4{transform:rotateY(-90deg) translateZ(calc(var(--s) / 2))}
.dice .f5{transform:rotateX(90deg) translateZ(calc(var(--s) / 2))}
.dice .f6{transform:rotateX(-90deg) translateZ(calc(var(--s) / 2))}
.pips{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:9%;width:66%;height:66%}
.pips i{border-radius:50%}
.pips i.on{background:var(--navy2);box-shadow:inset 0 2px 3px rgba(0,0,0,.45)}
.dice-shadow{position:absolute;left:12%;right:12%;bottom:-16%;height:12%;border-radius:50%;background:rgba(0,0,0,.5);filter:blur(8px);animation:dshadow 1.8s cubic-bezier(.25,.8,.3,1) both}
@keyframes roll{
  0%{transform:translateY(-110vh) rotateX(0) rotateY(0) rotateZ(0)}
  45%{transform:translateY(0) rotateX(540deg) rotateY(810deg) rotateZ(120deg)}
  60%{transform:translateY(-24%) rotateX(640deg) rotateY(980deg) rotateZ(240deg)}
  76%{transform:translateY(0) rotateX(700deg) rotateY(1060deg) rotateZ(330deg)}
  88%{transform:translateY(-6%) rotateX(718deg) rotateY(1078deg) rotateZ(356deg)}
  100%{transform:translateY(0) rotateX(720deg) rotateY(1080deg) rotateZ(360deg)}}
@keyframes dshadow{0%{transform:scale(.2);opacity:0}45%,76%,100%{transform:scale(1);opacity:1}60%{transform:scale(.7);opacity:.6}}
.wobble{animation:wobble 2.4s ease-in-out 2s infinite}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}

/* ---------- pregunta (pantalla) ---------- */
.stage{display:flex;flex-direction:column;gap:18px;min-height:calc(100vh - 74px - 110px);min-height:calc(100dvh - 74px - 110px)}
.answered{flex:none;text-align:center;background:rgba(255,255,255,.1);border-radius:16px;padding:8px 16px;min-width:110px}
.answered b{display:block;font-size:2.2rem;font-weight:900;line-height:1.1;color:var(--orange2)}
.answered span{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.stage.preview{min-height:0;height:100%}
.qtop{display:flex;gap:22px;align-items:center}
.qtitle{font-size:clamp(1.5rem,3.1vw,2.8rem);font-weight:800;line-height:1.15;margin:.15em 0 0;overflow-wrap:anywhere}
.preview .qtitle{font-size:2.5rem}
.qbody{flex:1;display:grid;gap:16px;align-content:end}

/* ---------- cifrado del archivo de rondas (AES-GCM con contraseña) ---------- */
const b64 = {
  enc(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); },
  dec(str) { const s = atob(str); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
};
async function deriveKey(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function sealData(obj, pass, savedAt) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(pass, salt);
  const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
  return { app: 'juegos-en-vivo', v: 2, savedAt: savedAt || Date.now(), salt: b64.enc(salt), iv: b64.enc(iv), data: b64.enc(ct) };
}
async function openData(file, pass) {
  const key = await deriveKey(pass, b64.dec(file.salt));
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64.dec(file.iv) }, key, b64.dec(file.data));
  return JSON.parse(new TextDecoder().decode(pt));
}

function makeQR(text) {
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(), m = 2; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + m},${r + m}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="Código QR para unirse"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#06103a"/></svg>`;
}
async function shrinkImage(src, max, quality) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(img.naturalWidth * s)); c.height = Math.max(1, Math.round(img.naturalHeight * s));
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', quality);
}

  if (!file || !/^image\//.test(file.type)) throw new Error('tipo');
  const url = URL.createObjectURL(file);
  try { return await shrinkImage(url, max, 0.84); } finally { URL.revokeObjectURL(url); }
}

const Sound = {
  ctx: null, on: store.get('qdx-sound', true),
  c() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(f, d, type = 'sine', vol = .14, when = 0) {
    if (!this.on) return; const c = this.c(); if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .03);
  },
  dice() { let t = 0; for (let i = 0; i < 11; i++) { this.tone(180 + Math.random() * 380, .05, 'triangle', .09, t); t += .07 + i * .012; } },
  tick() { this.tone(1046, .07, 'square', .045); },
  go() { this.tone(659, .12, 'sine', .16); this.tone(988, .26, 'sine', .16, .12); },
  reveal() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .32, 'triangle', .12, i * .09)); },
  drum() { for (let i = 0; i < 16; i++) this.tone(110 + (i % 2) * 8, .08, 'square', .05 + i * .004, i * .13); },
  fanfare() { [523, 523, 523, 698, 880, 784, 1047].forEach((f, i) => this.tone(f, .38, 'sawtooth', .055, i * .17)); },
  join() { this.tone(880, .09, 'sine', .07); this.tone(1320, .12, 'sine', .06, .07); }
};

/* ---------- confeti ---------- */
function confetti(count = 160, ox = .5, oy = .4) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = el('canvas', { class: 'confetti' }); document.body.append(cv);
  const dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const c = cv.getContext('2d'); c.scale(dpr, dpr);
  const cols = ['#ff8a1f', '#ffb04a', '#ffffff', '#2f6fde', '#ffc23d', '#8a4fe0', '#22a861'];
  const ps = Array.from({ length: count }, () => ({ x: W * ox, y: H * oy, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 4, r: Math.random() * 7 + 4, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, c: cols[Math.random() * cols.length | 0], sq: Math.random() < .6 }));
  const t0 = performance.now();
  (function f(t) {
    const age = t - t0; c.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.vy += .33; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.globalAlpha = Math.max(0, 1 - age / 3400); c.fillStyle = p.c;
      if (p.sq) c.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); else { c.beginPath(); c.arc(0, 0, p.r / 2.4, 0, 7); c.fill(); }
      c.restore();
    }
    if (age < 3500) requestAnimationFrame(f); else cv.remove();
  })(t0);
}

   ANFITRIONA
   ================================================================== */
async function Host() {
  let idbOk = true, hadLocal = false;
  let data = await loadData();
  let view = { name: 'home' };
  let game = null;            // sala en vivo o prueba
  let live = null;            // refresca solo las zonas dinámicas de la pantalla actual
  let saveT = null, savedEl = null, saveState = 'ok';

  /* ---------- datos ---------- */
  function q(text, options, correct, extra) { return Object.assign({ id: rid(8), text, img: null, reveal: false, options, correct, time: 20 }, extra || {}); }
  function defaultData() {
    return { v: 1,
      event: { title: 'Ampliada DX', subtitle: 'Q3 FY26 · Equipo Experience', tagline: 'Every second counts', logo: null, points: 5 },
      rounds: [
        { id: rid(8), name: 'Ronda de inicio', questions: [
          q('¿Cuál es la capital de Chile? (pregunta de ejemplo)', ['Valparaíso', 'Santiago', 'Concepción', 'La Serena'], 1),
          q('¿Quién es esta persona cuando era pequeña?', ['Nombre 1', 'Nombre 2', 'Nombre 3', 'Nombre 4'], 0, { reveal: true, time: 25 })] },
        { id: rid(8), name: 'Ronda del medio', questions: [
          q('¿Cuántas regiones tiene Chile? (pregunta de ejemplo)', ['14', '15', '16', '17'], 2)] },
        { id: rid(8), name: 'Ronda de cierre', questions: [
          q('¿Qué te pareció la Ampliada?', ['¡Increíble!', 'Muy buena', 'Buena', 'Puede mejorar'], -1, { time: 30 })] }
      ] };
  }
  function normQ(x) {
    return { id: x.id || rid(8), text: String(x.text || ''), img: x.img || null, reveal: !!x.reveal,
      options: [0, 1, 2, 3].map(j => String((x.options && x.options[j]) || '')),
      correct: typeof x.correct === 'number' ? x.correct : 0, time: Number(x.time) || 20 };
  }
  function normalize(d) {
    d.event = Object.assign({ title: '', subtitle: '', tagline: '', logo: null, points: 5 }, d.event || {});
    d.event.points = Math.max(1, Math.min(1000, Math.round(Number(d.event.points) || 5)));
    d.rounds = (d.rounds || []).map(r => ({ id: r.id || rid(8), name: String(r.name || 'Ronda'), questions: (r.questions || []).map(normQ) }));
    d.updatedAt = Number(d.updatedAt) || 0;
    return d;
  }
  async function loadData() {
    let d = null;
    try { d = await idb.get('data'); } catch (e) { idbOk = false; }
    if (d && Array.isArray(d.rounds)) hadLocal = true; else d = defaultData();
    return normalize(d);
  }
  async function writeNow() {
    clearTimeout(saveT); saveT = null;
    try { await idb.set('data', data); setSaved('ok'); } catch (e) { setSaved('err'); }
  }
  function persist() {
    data.updatedAt = Date.now();
    setSaved('saving');
    clearTimeout(saveT);
    saveT = setTimeout(writeNow, 300);
  }
  // si cierras o cambias de pestaña con un cambio pendiente, se guarda de inmediato
  const flush = () => { if (saveT) writeNow(); };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
  window.addEventListener('pagehide', flush);

  /* ---------------- ACCESO + GUARDADO EN LA NUBE ----------------
     Tu usuario y clave son la llave que cifra tus rondas. La copia en la nube es
     el archivo rondas.dat dentro de tu repositorio de GitHub, siempre cifrado. */
  const CLOUD_FILE = 'rondas.dat';
  const normUser = u => String(u || '').trim().toLowerCase();
  const secretOf = (u, p) => normUser(u) + ':' + p;
  function detectRepo() {
    const saved = store.get('qdx-repo', null);
    if (saved && saved.owner && saved.repo) return saved;
    const h = location.hostname;
    if (!/\.github\.io$/i.test(h)) return null;
    const owner = h.split('.')[0];
    const seg = location.pathname.split('/').filter(Boolean)[0];
    return { owner, repo: seg && !/\.html?$/i.test(seg) ? seg : owner + '.github.io' };
  }
  const repo = detectRepo();
  const apiUrl = () => `https://api.github.com/repos/${repo.owner}/${repo.repo}/contents/${CLOUD_FILE}`;
  let cloud = store.get('qdx-cloud', null) || {};   // { token, savedAt } en este equipo
  let auth = store.get('qdx-auth', null);           // { user, salt, hash } para verificar la clave en este equipo
  let session = (() => { try { return JSON.parse(sessionStorage.getItem('qdx-session-auth') || 'null'); } catch (e) { return null; } })();
  let remote = null, cloudState = 'idle', saveUIEl = null;

  // devuelve el archivo cifrado, false si no existe, o null si no hay conexión
  async function cloudRead() {
    const ok = j => (j && j.app === 'juegos-en-vivo' && j.data ? j : false);
    let net = false;
    if (repo) {
      try {
        const r = await fetch(apiUrl(), { headers: { Accept: 'application/vnd.github.raw' }, cache: 'no-store' });
        net = true;
        if (r.ok) return ok(await r.json());
        if (r.status === 404) return false;
      } catch (e) {}
    }
    if (location.protocol === 'file:') return net ? false : null;
    try {
      const r = await fetch(CLOUD_FILE + '?t=' + Date.now(), { cache: 'no-store' });
      return r.ok ? ok(await r.json()) : false;
    } catch (e) { return net ? false : null; }
  }
  async function makeVerifier(user, secret, salt) {
    salt = salt || crypto.getRandomValues(new Uint8Array(16));
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 250000, hash: 'SHA-256' }, base, 256);
    return { user: normUser(user), salt: b64.enc(salt), hash: b64.enc(bits) };
  }
  function setSession(user, secret) {
    session = { user: normUser(user), secret };
    try { sessionStorage.setItem('qdx-session-auth', JSON.stringify(session)); } catch (e) {}
  }
  function logout() {
    if (game && !game.test) { toast('Cierra la sala en vivo antes de salir.'); return; }
    game = null; session = null;
    try { sessionStorage.removeItem('qdx-session-auth'); } catch (e) {}
    view = { name: 'home' }; render();
  }

  async function doLogin(user, pass, msg, btn) {
    if (!normUser(user) || !pass) { msg.textContent = 'Escribe tu usuario y tu clave.'; return; }
    const secret = secretOf(user, pass);
    btn.disabled = true; msg.textContent = 'Verificando…';
    try {
      const fresh = await cloudRead();
      if (fresh !== null) remote = fresh;
      if (remote) {
        let payload;
        try { payload = await openData(remote, secret); } catch (e) { msg.textContent = 'Usuario o clave incorrectos.'; return; }
        auth = await makeVerifier(user, secret); store.set('qdx-auth', auth);
        if (payload.token) cloud.token = payload.token;
        const synced = cloud.savedAt || 0, rAt = remote.savedAt || 0;
        // el archivo inicial (sin rondas) nunca reemplaza lo que ya preparaste en este equipo

  function compileQ(x) {

    if (slots.length < 2) errs.push('necesita al menos 2 opciones');
    let correct = -1;
    if (x.correct >= 0) { correct = slots.indexOf(x.correct); if (correct < 0) errs.push('la opción marcada como correcta está vacía'); }
    const opts = slots.length ? slots.map(j => x.options[j].trim()) : ['Opción A', 'Opción B'];
    return { errs, q: { id: x.id, text: text || '¿Quién es?', img: x.img, imgSmall: null, reveal: !!(x.reveal && x.img), options: opts, slots: slots.length ? slots : [0, 1], correct: correct, time: x.time } };

      (resume.kicked || []).forEach(k => game.kicked.add(k));
      (resume.players || []).forEach(p => game.players.set(p.pid, { pid: p.pid, name: p.name, joinedAt: p.joinedAt, rs: p.rs || {}, conn: null, online: false, seen: 0, imgSent: new Set() }));

  async function connectPeer(g, fixed, attempt) {
    const code = fixed || rid(6);
    const opts = await peerOpts(data.event.turnUrl);
    if (game !== g) return;
    const pr = new Peer(PREFIX + code, opts);
    g.peer = pr;
    pr.on('open', () => {
      if (g.peer !== pr || game !== g) return;
      g.code = code;
      g.joinUrl = location.origin + location.pathname + '?j=' + code + (okTurnUrl(data.event.turnUrl) ? '&tk=' + encodeURIComponent(data.event.turnUrl.trim()) : '');
      g.qrSvg = makeQR(g.joinUrl);
      g.status = 'open'; saveSession(); wakeLock(); gameRender();

    pr.on('connection', c => setupConn(g, c));
    pr.on('disconnected', () => setTimeout(() => { try { if (!pr.destroyed && pr.disconnected) pr.reconnect(); } catch (e) {} }, 1500));
    pr.on('error', err => {
      if (g.peer !== pr || game !== g) return;
      if (g.status !== 'open') {
        try { pr.destroy(); } catch (e) {}
        if (err.type === 'unavailable-id') {
          if (fixed && attempt < 15) { g.statusMsg = 'Recuperando el código ' + fixed.toUpperCase() + '…'; gameRender(); setTimeout(() => connectPeer(g, fixed, attempt + 1), 2000); }
          else { if (fixed) toast('No se pudo recuperar el código anterior: se creó uno nuevo. Muestra el QR otra vez.'); connectPeer(g, null, 0); }
          return;
        }
        if (attempt < 3) { setTimeout(() => connectPeer(g, fixed, attempt + 1), 2000); return; }

  }
  function send(p, m) { if (!p.conn) return; try { if (p.conn.open) p.conn.send(m); } catch (e) {} }
  function broadcast() { if (!game) return; for (const p of game.players.values()) send(p, pview(p)); }
  function uniqueName(name, pid) {
    const taken = new Set(list().filter(p => p.pid !== pid).map(p => p.name.toLowerCase()));
    if (!taken.has(name.toLowerCase())) return name;

  }

  function pview(p) {

    v.history = Object.values(g.done).filter(d => d.ranks && d.ranks[p.pid]).sort((a, b) => a.at - b.at)
      .map(d => ({ round: d.name, rank: d.ranks[p.pid], count: d.count, quiz: d.quiz, score: d.scores ? d.scores[p.pid] || 0 : 0 }));
    if (g.round && g.phase !== 'hub' && g.phase !== 'total') {

    if (errs.length) { await showErrors(errs); return false; }
    if (!qs.length) { toast('Esta ronda no tiene preguntas.'); return false; }
    const id = r.id + (onlyQ ? ':' + onlyQ : '');
    game.round = { id, name: r.name, idx: data.rounds.indexOf(r) + 1, questions: qs };
    for (const p of game.players.values()) delete p.rs[id];
    delete game.done[id];
    game.qi = -1; game.phase = 'intro';
    qs.forEach(x => { if (x.img) shrinkImage(x.img, 720, .76).then(s => { x.imgSmall = s; }).catch(() => {}); });
    Sound.dice(); view = { name: 'game' }; render(); broadcast(); saveSession();
    return true;
  }
  function goQuestion(i) {
    const g = game, x = g.round.questions[i];
    clearTimeout(g.timer); clearBots();
    g.qi = i; g.phase = 'ready'; g.qStart = Date.now() + READY_MS; g.qEnd = g.qStart + x.time * 1000;
    g.timer = setTimeout(() => beginQuestion(i), READY_MS);
    Sound.dice(); gameRender(); broadcast();
    for (const p of g.players.values()) sendImg(p, x);
  }
  function beginQuestion(i) {
    const g = game; if (!g || g.phase !== 'ready' || g.qi !== i) return;
    const x = g.round.questions[i];
    g.phase = 'question'; g.qStart = Date.now(); g.qEnd = g.qStart + x.time * 1000; lastTick = 0;
    clearTimeout(g.timer); g.timer = setTimeout(reveal, x.time * 1000 + 400);
    Sound.go(); gameRender(); broadcast();
    if (g.test) botsPlay(x);
  }
  function answer(p, qi, opt) {
    const g = game;
    if (g.phase !== 'question' || qi !== g.qi) return;
    const x = g.round.questions[qi], me = rs(p);
    if (me.answers[x.id]) return;
    opt = Number(opt);
    if (!Number.isInteger(opt) || opt < 0 || opt >= x.options.length) return;
    const t = Date.now() - g.qStart; if (t > x.time * 1000 + 1000) return;
    me.answers[x.id] = { opt, t: Math.min(t, x.time * 1000), gain: 0 };
    send(p, pview(p)); refresh();
    const on = online();
    if (on.length && on.every(o => rs(o).answers[x.id])) { clearTimeout(g.timer); g.timer = setTimeout(reveal, 900); }
  }
  function reveal() {
    const g = game; if (!g || g.phase !== 'question') return;
    clearTimeout(g.timer); clearBots();
    const x = g.round.questions[g.qi];
    for (const p of g.players.values()) {
      const me = rs(p), a = me.answers[x.id]; me.gain = 0;
      if (a && x.correct >= 0 && a.opt === x.correct) {
        a.gain = data.event.points;   // puntaje fijo por acierto; la rapidez solo desempata
        me.score += a.gain; me.gain = a.gain; me.time += a.t;
      }
    }
    g.phase = 'reveal'; Sound.reveal(); gameRender(); broadcast(); saveSession();
  }
  function next() {
    const g = game, x = g.round.questions[g.qi];

  /* ---------- modo prueba ---------- */
  function addBots(n) {
    const used = new Set(list().map(p => p.name));
    for (let i = 0; i < n; i++) {
      const name = BOT_NAMES.find(b => !used.has(b)) || 'Invitado ' + (game.players.size + 1);
      used.add(name);
      const pid = 'bot-' + rid(6);
      game.players.set(pid, { pid, name, joinedAt: Date.now() + i, rs: {}, conn: null, online: true, bot: true });
    }
  }
  function botsPlay(x) {
    for (const p of game.players.values()) {
      if (!p.bot || Math.random() < .08) continue;
      const opt = x.correct >= 0 && Math.random() < .6 ? x.correct : Math.floor(Math.random() * x.options.length);
      game.botTimers.push(setTimeout(() => { if (game && game.phase === 'question' && game.round.questions[game.qi] === x) answer(p, game.qi, opt); }, 900 + Math.random() * x.time * 820));
    }
  }

    const back = clone({ name: view.name, roundId: view.roundId, sel: view.sel });
    game = newGame(true); game.back = back; addBots(8);
    if (!await launchRound(roundId, onlyQ)) { game = null; return; }
  }
  function exitTest(silent) {

  /* ---------- CSV ---------- */
  function downloadResults() {
    const esc = s => '"' + String(s).replace(/"/g, '""') + '"';
    const rounds = Object.entries(game.done).sort((a, b) => a[1].at - b[1].at);
    const head = ['Puesto', 'Nombre', 'Total'];
    rounds.forEach(([, d]) => head.push(d.name + ' (puesto)', d.name + ' (puntos)'));
    rounds.forEach(([, d]) => d.qs.forEach((x, i) => head.push(`${d.name} · P${i + 1}: ${x.text}`)));
    const rows = rankTotal().map((p, i) => {
      const row = [i + 1, p.name, totalScore(p)];
      rounds.forEach(([id, d]) => row.push(d.ranks[p.pid] || '—', (p.rs[id] && p.rs[id].score) || 0));
      rounds.forEach(([id, d]) => d.qs.forEach(x => {
        const a = p.rs[id] && p.rs[id].answers[x.id];
        row.push(!a ? '—' : x.options[a.opt] + (x.correct < 0 ? '' : a.opt === x.correct ? ' ✓' : ' ✗'));
      }));
      return row;
    });
    download(new Blob(['﻿' + [head, ...rows].map(r => r.map(esc).join(';')).join('\r\n')], { type: 'text/csv;charset=utf-8' }),
      'resultados-' + new Date().toISOString().slice(0, 10) + '.csv');
  }

    const r = rankTotal();
    mount(gameTop(), el('div', { class: 'wrap' },
      el('h1', { class: 'bigtitle', style: { 'font-size': 'clamp(2rem,4vw,3.2rem)', 'text-align': 'center', margin: '6px 0 6px', 'animation-delay': '0s' } }, 'Ranking ', el('em', { text: 'general' })),
      el('p', { class: 'lead', style: { 'text-align': 'center', 'margin-bottom': '18px' }, text: 'Suma de todas las rondas jugadas' }),
      r.length >= 3 ? podiumNodes(r, totalScore) : null,
      el('div', { class: 'rank' }, rankRows(r, totalScore, null, 20).slice(r.length >= 3 ? 3 : 0))),
      actions(null, el('button', { id: 'primary', class: 'btn primary big', onclick: () => { game.phase = 'hub'; render(); } }, '← Volver a la sala')));
    if (r.length >= 3) setTimeout(() => { Sound.fanfare(); confetti(200, .5, .3); }, 2600);
    live = updOnline;
  }

  mount(el('div', { class: 'plwrap' }, el('div', { class: 'pl' }, el('div', { class: 'pcenter' }, el('div', { class: 'spinner' })))));
  remote = await cloudRead();
  render();
}

/* ==================================================================
   PARTICIPANTE (celular)
   ================================================================== */
function Player() {
  const code = JOIN.toLowerCase().replace(/[^a-z0-9]/g, '');
  const hostId = PREFIX + code;
  let pid = store.get('qdx-pid', null);
  if (!pid) { pid = rid(12); store.set('qdx-pid', pid); }
  let name = store.get('qdx-name', '');
  let ev = store.get('qdx-ev', null);
  let peer = null, conn = null, st = null, joined = false, kicked = false;
  let retryT = null, pingT = null, fails = 0, lastKey = '', lastSec = 0, lastIn = 0;
  const imgs = new Map();

  const bar = el('div', { class: 'netbar hidden', role: 'status' });
  document.body.append(bar);
  const showBar = t => { bar.textContent = t; bar.classList.remove('hidden'); };
  const hideBar = () => bar.classList.add('hidden');
  const page = (...kids) => mount(el('div', { class: 'plwrap' }, el('div', { class: 'pl' }, kids)));
  const evBlock = () => ev && ev.title ? el('div', { class: 'pev' }, evTitle(ev.title, 'div'), ev.subtitle ? evSub(ev.subtitle) : null) : null;

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && joined && !kicked && !(conn && conn.open)) connect();
  });
  // si la pantalla principal deja de responder (por ejemplo, se recargó), reconectar
  setInterval(() => { if (joined && !kicked && conn && conn.open && Date.now() - lastIn > 12000) fail('Reconectando con la sala…'); }, 3000);
  setInterval(() => {
    const n = document.getElementById('pcd'); if (!n || !st || st.phase !== 'question') return;
    const left = Math.max(0, st.localEnd - Date.now()), sec = Math.ceil(left / 1000);
    n.textContent = sec; n.classList.toggle('low', left <= 5000);
    if (sec !== lastSec && sec <= 3 && sec > 0) { lastSec = sec; try { navigator.vibrate && navigator.vibrate(15); } catch (e) {} }
    if (left <= 0) document.querySelectorAll('.pbtn').forEach(b => { b.disabled = true; });
  }, 200);

  renderName();

  function renderName(err) {
    const input = el('input', { type: 'text', maxLength: 26, value: name, placeholder: 'Tu nombre', autocomplete: 'nickname', enterKeyHint: 'go', 'aria-label': 'Tu nombre' });
    const go = () => {
      const n = cleanName(input.value);
      if (!n) { renderName('Escribe tu nombre para entrar.'); return; }
      name = n; store.set('qdx-name', n); joined = true; wakeLock();
      page(el('div', { class: 'pcenter' }, el('div', { class: 'spinner' }), el('p', { text: 'Conectando con la sala…' })));
      connect();
    };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    page(el('div', { class: 'pcenter' }, evBlock(),
      el('div', { class: 'join' }, el('h2', { text: '¡Únete al juego!' }), el('p', { text: 'Escribe tu nombre como quieres que aparezca en la pantalla.' }),
        err ? el('p', { class: 'err', text: err }) : null, input, el('button', { class: 'btn primary', onclick: go }, 'Entrar'))));
    setTimeout(() => input.focus(), 60);
  }

  function cleanup() {
    clearInterval(pingT);
    const c = conn, p = peer; conn = null; peer = null;
    try { c && c.close(); } catch (e) {}
    try { p && p.destroy(); } catch (e) {}
  }
  function fail(msg) {
    if (kicked) return;
    cleanup(); fails++;
    showBar((msg || 'Se perdió la conexión.') + ' Reintentando…' + (fails >= 2 ? ' Si estás en el Wi-Fi de la oficina o con VPN, prueba con datos móviles.' : ''));
    clearTimeout(retryT); retryT = setTimeout(connect, Math.min(1500 + fails * 700, 7000));
  }
  async function connect() {
    clearTimeout(retryT); cleanup();
    const opts = await peerOpts();
    if (kicked) return;
    const pr = new Peer(opts); peer = pr;
    pr.on('open', () => {
      if (peer !== pr) return;
      const c = pr.connect(hostId, { reliable: true }); conn = c;
      const to = setTimeout(() => { if (conn === c && !c.open) fail('No pudimos conectar con la sala.'); }, 12000);
      c.on('open', () => {
        clearTimeout(to); if (conn !== c) return;
        lastIn = Date.now();
        c.send({ t: 'join', pid, name });
        clearInterval(pingT); pingT = setInterval(() => { try { if (c.open) c.send({ t: 'ping' }); } catch (e) {} }, 4000);
      });
      c.on('data', m => { if (conn === c) { lastIn = Date.now(); onMsg(m); } });
      c.on('close', () => { if (conn === c) fail(); });
      c.on('error', () => { if (conn === c) fail(); });
    });
    pr.on('error', err => { if (peer !== pr) return; fail(err.type === 'peer-unavailable' ? 'Buscando la sala…' : 'Problema de conexión.'); });
  }

  function onMsg(m) {
    if (!m || typeof m !== 'object') return;
    if (m.t === 'kicked') {
      kicked = true; cleanup(); hideBar();
      page(el('div', { class: 'pcenter' }, el('h1', { text: 'Saliste de la sala' }), el('p', { text: 'La anfitriona te quitó de la partida.' })));
      return;
    }
    if (m.t === 'img') {
      imgs.set(m.id, m.data);
      if (st && st.q && st.q.id === m.id && ['question', 'reveal'].includes(st.phase)) render(true);
      return;
    }
    if (m.t !== 'state') return;
    fails = 0; hideBar();
    if (m.ev) { ev = m.ev; store.set('qdx-ev', ev); }
    const prevPhase = st && st.phase;
    st = m;
    if (m.phase === 'question') { st.localEnd = Date.now() + m.remaining; st.elapsedNow = m.elapsed; }
    if (m.phase === 'ready') st.localReady = Date.now() + m.readyIn;
    if (m.phase === 'reveal' && prevPhase !== 'reveal' && !m.q.poll && m.my === m.correct) { confetti(110, .5, .35); try { navigator.vibrate && navigator.vibrate([40, 40, 80]); } catch (e) {} }
    if (m.phase === 'podium' && prevPhase !== 'podium' && m.round.quiz && m.rank === 1) setTimeout(() => confetti(220, .5, .3), 300);
    render();
  }

  function answer(k) {
    if (!st || st.phase !== 'question' || st.my != null || !conn || !conn.open) return;
    if (st.localEnd - Date.now() <= 0) return;
    try { navigator.vibrate && navigator.vibrate(30); } catch (e) {}
    st.my = k; conn.send({ t: 'answer', qi: st.qi, opt: k }); render();
  }

  function render(force) {
    const s = st;
    const key = [s.phase, s.qi, s.my, s.count, s.score, s.rank].join('|');
    if (!force && key === lastKey) return;
    lastKey = key;
    const head = playerHead(s);
    if (s.phase === 'lobby') {
      const quizHist = s.history.filter(h => h.quiz);
      page(head, el('div', { class: 'pcenter' }, evBlock(),
        el('h1', { text: s.history.length ? '¡Bien jugado!' : '¡Estás dentro!' }),
        el('p', { text: s.history.length ? 'Espera la próxima ronda. Te avisamos en esta pantalla.' : 'Mira la pantalla principal: la ronda comienza pronto.' }),
        el('p', { style: { opacity: '.65', 'font-size': '.95rem' }, text: plural(s.count, 'participante', 'participantes') + ' en la sala' }),
        quizHist.length ? el('div', { class: 'hist' }, quizHist.map(h => el('div', null, el('span', { text: h.round }), el('b', { text: `#${h.rank} de ${h.count}` })))) : null));
      return;
    }
    if (s.phase === 'intro') {
      page(head, el('div', { class: 'pcenter' }, el('div', { class: 'dicerow', style: { 'min-height': '120px' } }, dice(String(s.round.idx), 90)),
        el('div', { class: 'eyebrow fadeup d1', text: 'Ronda ' + s.round.idx }), el('h1', { class: 'fadeup d1', text: s.round.name }),
        el('p', { class: 'fadeup d2', text: s.round.quiz ? `${plural(s.round.n, 'pregunta', 'preguntas')}. Cada acierto suma ${s.points} puntos. Si hay empate, gana quien respondió más rápido.` : `${plural(s.round.n, 'pregunta', 'preguntas')}. ¡Vota desde aquí!` }),
        el('p', { class: 'fadeup d3', style: { opacity: '.7' }, text: '👀 Mira la pantalla principal' })));
      return;
    }
    if (s.phase === 'ready') {
      const left = Math.max(0, s.localReady - Date.now());
      page(head, el('div', { class: 'pcenter' }, el('div', { class: 'dicerow', style: { 'min-height': '120px' } }, dice(String(s.qi + 1), 90)),
        el('div', { class: 'eyebrow', text: `Pregunta ${s.qi + 1} de ${s.round.n}` }),
        el('h1', { class: 'fadeup', style: { 'animation-delay': '1.2s', 'font-size': 'clamp(1.25rem,6.5cqw,1.8rem)' }, text: s.q.text }),
        el('div', { class: 'readybar', style: { width: '100%' } }, el('i', { style: { '--d': left + 'ms' } })),
        el('p', { text: '¡Prepárate!' })));
      return;
    }
    if (s.phase === 'question') {
      const x = s.q;
      if (s.my == null) { lastSec = 0; page(head, playerQuestionNodes(s, imgs.get(x.id), answer, false)); }
      else page(head, el('div', { class: 'pcenter' },
        el('h1', { text: x.poll ? '¡Voto enviado!' : '¡Respuesta enviada!' }),
        el('div', { class: 'chosen', style: { '--c': COLORS[x.slots[s.my]] } }, lt(x.slots[s.my]), el('span', { text: x.options[s.my] })),
        el('p', { text: 'Espera los resultados en la pantalla…' })));
      return;
    }
    if (s.phase === 'reveal') {
      const x = s.q; let box;
      if (x.poll) box = el('div', { class: 'result neutral' }, el('h1', { text: s.my != null ? 'Votaste' : 'No alcanzaste a votar' }), s.my != null ? el('p', { text: x.options[s.my] }) : null);
      else if (s.my == null) box = el('div', { class: 'result neutral' }, el('h1', { text: '⏱ Se acabó el tiempo' }), el('p', { text: 'La correcta era: ' + x.options[x.correct] }));
      else if (s.my === s.correct) box = el('div', { class: 'result ok' }, el('h1', { text: '¡Correcto! 🎉' }), el('p', { text: '+' + fmt(s.gain) + ' puntos' }));
      else box = el('div', { class: 'result bad' }, el('h1', { text: 'Incorrecto' }), el('p', { text: 'La correcta era: ' + x.options[s.correct] }));
      page(head, el('div', { class: 'pcenter' }, box, !x.poll && s.round.quiz ? el('p', { text: `Vas en el puesto ${s.rank} de ${s.count} en esta ronda` }) : null));
      return;
    }
    if (s.phase === 'board') {
      page(head, el('div', { class: 'pcenter' }, el('p', { text: 'En ' + s.round.name + ' vas en el puesto' }), el('div', { class: 'bigrank', text: '#' + s.rank }),
        el('p', { text: `de ${s.count} · ${fmt(s.score)} pts` })));
      return;
    }
    if (s.phase === 'podium') {
      if (s.round.quiz) {
        const medal = ['🥇', '🥈', '🥉'][s.rank - 1] || '🎉';
        page(head, el('div', { class: 'pcenter' }, el('div', { style: { 'font-size': '4rem', 'line-height': '1' }, text: medal }),
          el('h1', { text: s.rank === 1 ? '¡Ganaste la ronda!' : `Terminaste #${s.rank}` }),
          el('p', { text: `${s.round.name} · de ${s.count} · ${fmt(s.score)} pts` }),
          s.podium && s.podium.length ? el('div', { class: 'hist' }, s.podium.map((p, i) => el('div', null, el('span', { text: ['🥇', '🥈', '🥉'][i] + ' ' + p.name }), el('b', { text: fmt(p.score) + ' pts' })))) : null));
      } else page(head, el('div', { class: 'pcenter' }, el('h1', { text: '¡Gracias por participar!' }), el('p', { text: 'Espera la próxima ronda.' })));
    }
  }
}
</script>
